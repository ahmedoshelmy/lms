<p-toast />
<div
  class="layout"
  [class.sidebar-closed]="!isSidebarOpen()"
  [class.sidebar-open]="isSidebarOpen()"
>
  @if (isSidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>
  }

  <app-sidebar [(isOpen)]="isSidebarOpen" (menuItemClicked)="onMenuItemClicked()" />

  <div class="content-wrapper">
    <header class="mobile-header">
      <button
        type="button"
        class="mobile-menu-btn"
        aria-label="Open navigation menu"
        (click)="openSidebar()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <span class="mobile-header__title">Mindvalley</span>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
