<!-- First on the page, seen only once focused: one Tab, then Enter, and the
     navigation is behind you. -->
<a class="skip-link" href="#main-content" (click)="skipToContent($event)">Skip to main content</a>
<p-toast />
<!-- The one confirmation dialog, driven by ConfirmService. -->
<app-confirm-host />
<app-command-palette />

<!-- Sits above everything, because the whole point is that it cannot be
     walked past. It shows nothing at all unless there is something the
     person signed in can actually do. -->
<app-outstanding-work />
<!-- Outside the part made inert under the drawer, which would silence it. -->
<div class="sr-only" aria-live="polite" aria-atomic="true">{{ pageAnnouncement() }}</div>
<div
  class="layout"
  [class.sidebar-closed]="!isSidebarOpen()"
  [class.sidebar-open]="isSidebarOpen()"
>
  @if (drawerOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Close navigation menu"
      (click)="closeSidebar()"
    ></button>
  }

  <!-- On phones the sidebar is a drawer. Closed, it is off screen and inert so
       Tab cannot wander into it; open, the page behind it is inert instead, and
       Escape or the backdrop closes it. -->
  <app-sidebar
    [isOpen]="isSidebarOpen()"
    (isOpenChange)="$event ? openSidebar() : closeSidebar()"
    [drawer]="isPhone()"
    [attr.inert]="drawerHidden() ? '' : null"
    (menuItemClicked)="onMenuItemClicked()"
  />

  <div class="content-wrapper" [attr.inert]="drawerOpen() ? '' : null">
    <header class="mobile-header">
      <button
        #menuButton
        type="button"
        class="mobile-menu-btn"
        aria-label="Open navigation menu"
        [attr.aria-expanded]="drawerOpen()"
        (click)="openSidebar()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
      <span class="mobile-header__title">Mindvalley</span>
    </header>

    <!-- Focusable by script only: where the skip link goes, and where the focus
         goes when the drawer closes onto a page. -->
    <main class="content" id="main-content" #mainContent tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
