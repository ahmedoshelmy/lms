<aside class="sidebar" [class.closed]="!isOpen()" aria-label="Main navigation">
  <button
    type="button"
    class="toggle-btn"
    [attr.aria-label]="isOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleSidebar()"
  >
    <i [class]="isOpen() ? 'pi pi-chevron-left' : 'pi pi-chevron-right'" aria-hidden="true"></i>
  </button>

  <div class="logo-section">
    <div class="logo-icon">
      <i class="pi pi-graduation-cap" aria-hidden="true"></i>
    </div>
    <div class="logo-text">
      <h3>Mindvalley</h3>
      <span>MANAGEMENT</span>
    </div>
  </div>

  <div class="role-badge-container">
    <span class="role-badge">{{ currentRole() }}</span>
  </div>

  <nav class="menu" aria-label="Primary">
    @for (item of menuItems(); track item.route) {
      <a
        class="menu-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        [attr.title]="!isOpen() ? item.label : null"
        (click)="onMenuItemClick()"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        <span class="menu-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a
      routerLink="/profile"
      routerLinkActive="active"
      class="user-section"
      aria-label="My Profile"
      [attr.title]="!isOpen() ? userProfile().name + ' (Profile)' : null"
      (click)="onMenuItemClick()"
    >
      <div class="avatar" aria-hidden="true">
        {{ userProfile().initials }}
      </div>
      <div class="user-info">
        <h4>{{ userProfile().name }}</h4>
      </div>
    </a>

    <!-- Above the sign-out row rather than in it: the badge is the one thing
         in the sidebar that changes on its own, and it should not sit next to
         a button that ends the session. -->
    <app-notification-bell [compact]="!isOpen()" />

    <div class="footer-actions">
      <button
        type="button"
        class="logout-btn"
        aria-label="Sign out"
        [attr.title]="!isOpen() ? 'Logout' : null"
        (click)="logout()"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="menu-label">Logout</span>
      </button>

      <!-- How every time on the site reads. Here rather than on the settings
           page, which is a technical corner most people never open. -->
      <button
        type="button"
        class="theme-toggle-btn clock-toggle-btn"
        [attr.aria-label]="
          clock.is12Hour() ? 'Switch to the 24-hour clock' : 'Switch to the 12-hour clock'
        "
        [attr.title]="
          clock.is12Hour()
            ? 'Times read 4:30 pm — switch to 16:30'
            : 'Times read 16:30 — switch to 4:30 pm'
        "
        (click)="clock.toggle()"
      >
        {{ clock.is12Hour() ? '12h' : '24h' }}
      </button>

      <button
        type="button"
        class="theme-toggle-btn"
        [attr.aria-label]="isDark() ? 'Light Mode' : 'Dark Mode'"
        [attr.title]="isDark() ? 'Light Mode' : 'Dark Mode'"
        (click)="toggleTheme()"
      >
        <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</aside>
