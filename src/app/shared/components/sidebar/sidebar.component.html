<aside class="sidebar" [class.closed]="!isOpen()" aria-label="Main navigation">
  <button
    type="button"
    class="toggle-btn"
    [attr.aria-label]="
      drawer() ? 'Close navigation menu' : isOpen() ? 'Collapse sidebar' : 'Expand sidebar'
    "
    [attr.aria-expanded]="drawer() ? null : isOpen()"
    (click)="toggleSidebar()"
  >
    <i [class]="isOpen() ? 'pi pi-chevron-left' : 'pi pi-chevron-right'" aria-hidden="true"></i>
  </button>

  <div class="logo-section">
    <img class="logo-icon" src="icons/icon.svg" alt="" width="40" height="40" />
    <div class="logo-text">
      <h3>Mindvalley</h3>
      <span>MANAGEMENT</span>
    </div>
  </div>

  <div class="role-badge-container">
    <span class="role-badge">{{ currentRole() }}</span>
  </div>

  <nav class="menu" aria-label="Primary">
    @for (item of menuItems(); track item.route) {
      <a
        class="menu-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="item.label"
        [attr.title]="!isOpen() ? item.label : null"
        (click)="onMenuItemClick()"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        <span class="menu-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a
      routerLink="/profile"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      class="user-section"
      [attr.title]="!isOpen() ? userProfile().name + ' (Profile)' : null"
      (click)="onMenuItemClick()"
    >
      <!-- Named by the hidden line, not an aria-label: that would have to
           repeat the initials and the name shown, and the name is hidden
           when the sidebar is collapsed. -->
      <span class="sr-only">{{ userProfile().name }}, your profile</span>
      <div class="avatar" aria-hidden="true">
        {{ userProfile().initials }}
      </div>
      <div class="user-info" aria-hidden="true">
        <h4>{{ userProfile().name }}</h4>
      </div>
    </a>

    <!-- Above the sign-out row rather than in it: the badge is the one thing
         in the sidebar that changes on its own, and it should not sit next to
         a button that ends the session. -->
    <app-notification-bell [compact]="!isOpen()" />

    <!-- Only while the browser offers it: an installed app opens like any
         other, without the browser's bars. -->
    @if (pwa.canInstall()) {
      <button
        type="button"
        class="logout-btn install-btn"
        [attr.title]="!isOpen() ? 'Install app' : null"
        (click)="pwa.install()"
      >
        <i class="pi pi-download" aria-hidden="true"></i>
        <span class="menu-label">Install app</span>
      </button>
    }

    <div class="footer-actions">
      <button
        type="button"
        class="logout-btn"
        aria-label="Sign out"
        [attr.title]="!isOpen() ? 'Sign out' : null"
        (click)="logout()"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="menu-label">Sign out</span>
      </button>

      <!-- How every time on the site reads. Here rather than on the settings
           page, which is a technical corner most people never open. -->
      <button
        type="button"
        class="theme-toggle-btn clock-toggle-btn"
        [attr.aria-label]="
          clock.is12Hour() ? '12h clock, switch to 24h' : '24h clock, switch to 12h'
        "
        [attr.title]="
          clock.is12Hour()
            ? 'Times read 4:30 pm — switch to 16:30'
            : 'Times read 16:30 — switch to 4:30 pm'
        "
        (click)="clock.toggle()"
      >
        {{ clock.is12Hour() ? '12h' : '24h' }}
      </button>

      <button
        type="button"
        class="theme-toggle-btn"
        [attr.aria-label]="isDark() ? 'Light Mode' : 'Dark Mode'"
        [attr.title]="isDark() ? 'Light Mode' : 'Dark Mode'"
        (click)="toggleTheme()"
      >
        <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</aside>
