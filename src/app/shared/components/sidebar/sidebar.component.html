<aside class="sidebar" [class.closed]="!isOpen()" aria-label="Main navigation">
  <button
    type="button"
    class="toggle-btn"
    [attr.aria-label]="isOpen() ? 'Collapse sidebar' : 'Expand sidebar'"
    [attr.aria-expanded]="isOpen()"
    (click)="toggleSidebar()"
  >
    <i [class]="isOpen() ? 'pi pi-chevron-left' : 'pi pi-chevron-right'" aria-hidden="true"></i>
  </button>

  <div class="logo-section">
    <div class="logo-icon">
      <i class="pi pi-graduation-cap" aria-hidden="true"></i>
    </div>
    <div class="logo-text">
      <h3>Mindvalley</h3>
      <span>MANAGEMENT</span>
    </div>
  </div>

  <div class="role-badge-container">
    <span class="role-badge">{{ currentRole() }}</span>
  </div>

  <nav class="menu" aria-label="Primary">
    @for (item of menuItems(); track item.route) {
      <a
        class="menu-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [attr.aria-label]="item.label"
        [attr.title]="!isOpen() ? item.label : null"
        (click)="onMenuItemClick()"
      >
        <i [class]="item.icon" aria-hidden="true"></i>
        <span class="menu-label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <a
      routerLink="/profile"
      routerLinkActive="active"
      class="user-section"
      aria-label="My Profile"
      [attr.title]="!isOpen() ? userProfile().name + ' (Profile)' : null"
      (click)="onMenuItemClick()"
    >
      <div class="avatar" aria-hidden="true">
        {{ userProfile().initials }}
      </div>
      <div class="user-info">
        <h4>{{ userProfile().name }}</h4>
      </div>
    </a>

    <div class="footer-actions">
      <button
        type="button"
        class="logout-btn"
        aria-label="Sign out"
        [attr.title]="!isOpen() ? 'Logout' : null"
        (click)="logout()"
      >
        <i class="pi pi-sign-out" aria-hidden="true"></i>
        <span class="menu-label">Logout</span>
      </button>

      <button
        type="button"
        class="theme-toggle-btn"
        [attr.aria-label]="isDark() ? 'Light Mode' : 'Dark Mode'"
        [attr.title]="isDark() ? 'Light Mode' : 'Dark Mode'"
        (click)="toggleTheme()"
      >
        <i [class]="isDark() ? 'pi pi-sun' : 'pi pi-moon'" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</aside>
