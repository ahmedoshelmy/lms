<div
  class="relative flex min-h-screen items-center justify-center overflow-hidden bg-linear-to-br from-(--color-primary) to-(--color-secondary) p-6"
>
  <!-- Glow Left -->
  <div
    class="pointer-events-none absolute -left-20 -top-20 h-80 w-80 rounded-full bg-(--color-primary-content) opacity-35 blur-[80px]"
  ></div>

  <!-- Glow Right -->
  <div
    class="pointer-events-none absolute -bottom-30 -right-25 h-100 w-100 rounded-full bg-(--color-secondary) opacity-35 blur-[80px]"
  ></div>

  <div class="relative z-10 w-full max-w-105">
    <!-- Auth Card -->
    <div
      class="w-full rounded-2xl bg-(--color-surface) px-5 py-7 text-center shadow-[0_20px_60px_rgba(0,0,0,0.2)] sm:p-10"
    >
      <!-- Header -->
      <div>
        <!-- The app's own icon, as on a home screen once installed. -->
        <img
          class="mx-auto mb-3 block h-15 w-15"
          src="icons/icon.svg"
          alt=""
          width="60"
          height="60"
        />
        <h1 class="m-0 text-2xl font-bold text-(--color-text-primary)">Welcome back</h1>
        <p class="mb-0 mt-2 text-[15px] text-(--color-text-muted)">
          Sign in to access your schedule
        </p>
      </div>

      <!-- Form -->
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="mt-6">
        <!-- Email Field -->
        <div class="mb-4 text-left">
          <label
            for="email"
            class="mb-1.5 block text-[13px] font-semibold text-(--color-text-secondary)"
            >Email</label
          >
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="you@example.com"
            autocomplete="email"
            class="box-border w-full rounded-[10px] border-2 border-(--color-border) bg-(--color-surface) px-3.5 py-3 text-sm text-(--color-text-primary) transition-all duration-200 focus:border-(--color-secondary) focus:outline-none focus:ring-[3px] focus:ring-[color-mix(in_srgb,var(--color-secondary)_15%,transparent)]"
            [class.!border-(--color-error)]="emailControl.invalid && emailControl.touched"
            [attr.aria-invalid]="emailControl.invalid && emailControl.touched"
            [attr.aria-describedby]="
              emailControl.invalid && emailControl.touched ? 'email-error' : null
            "
          />
          @if (emailControl.invalid && emailControl.touched) {
            <span id="email-error" class="mt-1.5 block text-xs text-(--color-error-foreground)"
              >Enter a valid email address.</span
            >
          }
        </div>

        <!-- Password Field -->
        <div class="mb-4 text-left">
          <label
            for="password"
            class="mb-1.5 block text-[13px] font-semibold text-(--color-text-secondary)"
            >Password</label
          >
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            class="box-border w-full rounded-[10px] border-2 border-(--color-border) bg-(--color-surface) px-3.5 py-3 text-sm text-(--color-text-primary) transition-all duration-200 focus:border-(--color-secondary) focus:outline-none focus:ring-[3px] focus:ring-[color-mix(in_srgb,var(--color-secondary)_15%,transparent)]"
            [class.!border-(--color-error)]="passwordControl.invalid && passwordControl.touched"
            [attr.aria-invalid]="passwordControl.invalid && passwordControl.touched"
            [attr.aria-describedby]="
              passwordControl.invalid && passwordControl.touched ? 'password-error' : null
            "
          />
          @if (passwordControl.invalid && passwordControl.touched) {
            <span id="password-error" class="mt-1.5 block text-xs text-(--color-error-foreground)"
              >Password is required.</span
            >
          }
        </div>

        <!-- General Error: read out as it appears, not only shown in red. -->
        @if (error()) {
          <span
            role="alert"
            class="mt-1.5 block text-left text-xs text-(--color-error-foreground)"
            >{{ error() }}</span
          >
        }

        <!-- Submit Button -->
        <button
          type="submit"
          [disabled]="loading()"
          class="mt-2 w-full rounded-[10px] border-none bg-linear-to-br from-(--color-primary) to-(--color-secondary) p-3.5 text-[15px] font-semibold text-(--color-primary-content) shadow-[0_4px_12px_color-mix(in_srgb,var(--color-primary)_30%,transparent)] transition-all duration-200 hover:-translate-y-px hover:shadow-[0_6px_20px_color-mix(in_srgb,var(--color-primary)_40%,transparent)] disabled:cursor-not-allowed disabled:opacity-70 disabled:hover:translate-y-0 disabled:hover:shadow-[0_4px_12px_color-mix(in_srgb,var(--color-primary)_30%,transparent)]"
        >
          @if (loading()) {
            <i class="pi pi-spinner pi-spin" aria-hidden="true"></i> Signing in…
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>
  </div>
</div>
