<p-dialog
  [visible]="visible()"
  (visibleChange)="onCancel()"
  [modal]="true"
  [draggable]="false"
  [resizable]="false"
  header="Schedule Standalone Session"
  styleClass="standalone-session-dialog"
  [style]="{ width: '90vw', maxWidth: '600px' }"
>
  <div class="space-y-4 pt-2">
    <p class="text-xs text-[var(--color-text-muted)]">
      Create an ad-hoc session (Trial, Recap, or Makeup) and assign it directly to an instructor
      without a group.
    </p>

    <!-- Session Type Selector -->
    <div>
      <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-2">
        Session Type
      </label>
      <div class="grid grid-cols-3 gap-2">
        <button
          type="button"
          class="type-card"
          [class.type-card--active]="sessionType() === SessionTypeEnum.TrialSession"
          (click)="sessionType.set(SessionTypeEnum.TrialSession)"
        >
          <span class="text-base">✨</span>
          <span class="font-bold text-xs">Trial</span>
        </button>

        <button
          type="button"
          class="type-card"
          [class.type-card--active]="sessionType() === SessionTypeEnum.RecapSession"
          (click)="sessionType.set(SessionTypeEnum.RecapSession)"
        >
          <span class="text-base">🔄</span>
          <span class="font-bold text-xs">Recap</span>
        </button>

        <button
          type="button"
          class="type-card"
          [class.type-card--active]="sessionType() === SessionTypeEnum.MakeupSession"
          (click)="sessionType.set(SessionTypeEnum.MakeupSession)"
        >
          <span class="text-base">🛠️</span>
          <span class="font-bold text-xs">Makeup</span>
        </button>
      </div>
    </div>

    <!-- Topic / Title -->
    <div>
      <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
        Topic / Title <span class="text-[var(--color-error)]">*</span>
      </label>
      <input
        type="text"
        class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
        placeholder="e.g. Python Placement Trial"
        [ngModel]="topic()"
        (ngModelChange)="topic.set($event)"
      />
    </div>

    <!-- Instructor & Location -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
          Instructor <span class="text-[var(--color-error)]">*</span>
        </label>
        <select
          class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
          [ngModel]="instructorId()"
          (ngModelChange)="instructorId.set($event)"
        >
          <option [ngValue]="null" disabled>Select Instructor</option>
          @for (inst of realInstructors(); track inst.id) {
            <option [value]="inst.id">{{ inst.name }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
          Location
        </label>
        <input
          type="text"
          class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
          placeholder="e.g. MOA or Online"
          [ngModel]="location()"
          (ngModelChange)="location.set($event)"
        />
      </div>
    </div>

    <!-- Date, Time & Duration -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
      <div>
        <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
          Date <span class="text-[var(--color-error)]">*</span>
        </label>
        <input
          type="date"
          class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
          [ngModel]="sessionDate()"
          (ngModelChange)="sessionDate.set($event)"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
          Start Time <span class="text-[var(--color-error)]">*</span>
        </label>
        <input
          type="time"
          class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
          [ngModel]="startTime()"
          (ngModelChange)="startTime.set($event)"
        />
      </div>

      <div>
        <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
          Duration (Min)
        </label>
        <select
          class="w-full px-3 py-2 text-sm bg-[var(--color-surface)] border border-[var(--color-border)] rounded-xl text-[var(--color-text-primary)] focus:outline-hidden focus:border-[var(--color-primary)]"
          [ngModel]="durationMinutes()"
          (ngModelChange)="durationMinutes.set($event)"
        >
          <option [value]="30">30 mins</option>
          <option [value]="45">45 mins</option>
          <option [value]="60">60 mins</option>
          <option [value]="90">90 mins</option>
          <option [value]="120">120 mins</option>
        </select>
      </div>
    </div>

    <!-- Assigned Students -->
    <div>
      <label class="block text-xs font-bold text-[var(--color-text-secondary)] uppercase mb-1">
        Assigned Students (Optional)
      </label>
      <div
        class="max-h-36 overflow-y-auto border border-[var(--color-border)] rounded-xl p-2 bg-[var(--color-surface)] space-y-1"
      >
        @if (loadingStudents()) {
          <p class="text-xs text-[var(--color-text-muted)] p-2">Loading students...</p>
        } @else if (students().length === 0) {
          <p class="text-xs text-[var(--color-text-muted)] p-2">No students available.</p>
        } @else {
          @for (student of students(); track student.id) {
            <label
              class="flex items-center gap-2 p-1.5 rounded-lg hover:bg-[var(--color-surface-hover)] cursor-pointer text-xs"
            >
              <input
                type="checkbox"
                [checked]="selectedStudentIds().includes(student.id)"
                (change)="toggleStudentSelection(student.id)"
                class="rounded text-[var(--color-primary)]"
              />
              <span class="font-medium text-[var(--color-text-primary)]">{{ student.name }}</span>
              <span class="text-[var(--color-text-muted)] text-[10px]">({{ student.email }})</span>
            </label>
          }
        }
      </div>
    </div>
  </div>

  <ng-template pTemplate="footer">
    <div class="flex items-center justify-end gap-2 pt-3 border-t border-[var(--color-border)]">
      <button
        pButton
        type="button"
        label="Cancel"
        class="p-button-text p-button-secondary p-button-sm cursor-pointer"
        (click)="onCancel()"
        [disabled]="submitting()"
      ></button>
      <button
        pButton
        type="button"
        label="Create Session"
        icon="pi pi-check"
        class="p-button-primary p-button-sm cursor-pointer"
        (click)="onSave()"
        [loading]="submitting()"
      ></button>
    </div>
  </ng-template>
</p-dialog>
