<div class="unauthorized-card">
  <div class="icon">
    <i class="pi pi-lock" aria-hidden="true"></i>
  </div>
  <h1>Access Denied</h1>
  <p>You don't have permission to view this page with your current role.</p>

  <div class="actions">
    <a [routerLink]="homeRoute" class="btn btn-primary">Go to Dashboard</a>
    <button type="button" class="btn btn-secondary" (click)="logout()">
      Sign out
    </button>
  </div>
</div>
