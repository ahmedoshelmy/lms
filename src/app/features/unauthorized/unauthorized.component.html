<div class="unauthorized-shell">
  <div class="unauthorized-card">
    <div class="icon">
      <i class="pi pi-lock" aria-hidden="true"></i>
    </div>
    <h1>Access Denied</h1>
    <p>You don't have permission to view this page.</p>
    <div class="actions">
      <a routerLink="/" class="btn btn-primary">
        <i class="pi pi-home" aria-hidden="true"></i> Back Home
      </a>
      <button (click)="logout()" type="button" class="btn btn-outline">
        <i class="pi pi-sign-out" aria-hidden="true"></i> Logout
      </button>
    </div>
  </div>
</div>
