# Security headers for every response. Included in each location of nginx.conf,
# because a location with an add_header of its own drops the server's.
#
# vercel.json carries the same headers; e2e/deploy-config.spec.ts fails if the
# two disagree, and every end-to-end test runs under this policy
# (e2e/support/serve.mjs reads this file), failing on any violation.
#
# Content-Security-Policy:
#   script-src 'self'        No inline script and no eval. The production build does
#                            not inline critical CSS (angular.json), whose loader is
#                            an inline onload handler.
#   style-src 'unsafe-inline' PrimeNG and Angular set styles on elements at runtime.
#   connect-src              The API. A new API host has to be added here and in
#                            vercel.json, or every request is refused.
#   img-src data: blob:      Generated PDFs and images drawn in the browser.
#   worker-src 'self'        The service worker.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://mv-api.inite.tech; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
